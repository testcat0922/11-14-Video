<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>影片＋GIF 輪播（支援 TXT 秒數）</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: black;
    }
    video, img {
      position: absolute;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      top: 0;
      left: 0;
    }
    #gifPlayer { display: none; }
  </style>
</head>
<body>

  <video id="player" autoplay muted playsinline></video>
  <img  id="gifPlayer" />

  <script>
    const baseURL = "https://github.com/testcat0922/11-14-Video/releases/latest/download/";

    // 讀取 txt → 解析：檔名 | 秒數
    async function loadList() {
      const res = await fetch('videos.txt');
      const lines = (await res.text()).split('\n').map(x => x.trim()).filter(Boolean);

      return lines.map(line => {
        const [name, time] = line.split('|');
        return {
          url: baseURL + name.trim(),
          duration: time ? parseInt(time.trim()) : null
        };
      });
    }

    (async () => {
      const list = await loadList();

      const video = document.getElementById('player');
      const gif   = document.getElementById('gifPlayer');

      let index = 0;
      let gifTimer = null;

      function playItem(i) {
        const item = list[i];
        const isGif = item.url.toLowerCase().endsWith('.gif');

        // 清除舊的 GIF 計時器
        if (gifTimer) clearTimeout(gifTimer);

        if (isGif) {
          // 顯示 GIF
          video.style.display = 'none';
          gif.style.display   = 'block';

          // 每次加時間戳避免 Cache
          gif.src = item.url + "?v=" + Date.now();

          // 如果 GIF 沒設定時間 → 預設 10 秒
          const ms = item.duration ?? 10000;

          gifTimer = setTimeout(next, ms);

        } else {
          // 播 MP4
          gif.style.display   = 'none';
          video.style.display = 'block';

          video.src = item.url + "?v=" + Date.now();
          video.load();
          video.play().catch(e => console.warn("Autoplay blocked:", e));
        }
      }

      function next() {
        index = (index + 1) % list.length;
        playItem(index);
      }

      // MP4 播完自動換下一個
      video.addEventListener("ended", next);

      // 開始播放
      playItem(index);
    })();
  </script>

</body>
</html>
