<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>自動讀取影片與GIF清單輪播</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    video, img {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
    }
    #player, #gifPlayer {
      position: absolute;
      top: 0; left: 0;
    }
  </style>
</head>
<body>
  <video id="player" autoplay muted playsinline></video>
  <img id="gifPlayer" style="display:none" />

  <script>
    const baseURL = "https://github.com/testcat0922/11-14-Video/releases/latest/download/";

    async function loadMediaList() {
      const res = await fetch("videos.txt");
      if (!res.ok) throw new Error("無法讀取 videos.txt");
      const names = (await res.text()).split("\n").map(x => x.trim()).filter(Boolean);
      return names.map(name => baseURL + name);
    }

    (async () => {
      const mediaList = await loadMediaList();
      const video = document.getElementById("player");
      const gif = document.getElementById("gifPlayer");
      let index = 0;

      function playMedia(i) {
        const url = mediaList[i];
        const isGIF = url.toLowerCase().endsWith(".gif");

        if (isGIF) {
          // 播 GIF
          video.style.display = "none";
          gif.style.display = "block";
          gif.src = url;

          // 設定顯示 10 秒後換下一個（GIF 沒有結束事件）
          setTimeout(() => nextMedia(), 10000);
        } else {
          // 播 MP4
          gif.style.display = "none";
          video.style.display = "block";
          video.src = url;
          video.load();
          video.play().catch(err => console.warn("autoplay 被阻擋：", err));
        }
      }

      function nextMedia() {
        index = (index + 1) % mediaList.length;
        playMedia(index);
      }

      video.addEventListener("ended", nextMedia);
      playMedia(index);
    })();
  </script>
</body>
</html>
