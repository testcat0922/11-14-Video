<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>自動讀取影片與GIF清單輪播</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    video, img {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
    }
    #player, #gifPlayer {
      position: absolute;
      top: 0; left: 0;
    }
  </style>

  <!-- GIF 解析器：gifuct-js -->
  <script src="https://cdn.jsdelivr.net/npm/gifuct-js@2.0.0/dist/gifuct.min.js"></script>

</head>
<body>
  <video id="player" autoplay muted playsinline></video>
  <img id="gifPlayer" style="display:none" />

  <script>
    const baseURL = "https://github.com/testcat0922/11-14-Video/releases/latest/download/";

    async function loadMediaList() {
      const res = await fetch("videos.txt");
      if (!res.ok) throw new Error("無法讀取 videos.txt");
      const names = (await res.text()).split("\n").map(x => x.trim()).filter(Boolean);
      return names.map(name => baseURL + name);
    }

    // 解析 GIF 時長
    async function getGifDuration(url) {
      const res = await fetch(url);
      const buf = await res.arrayBuffer();
      const gif = gifuct.parseGIF(buf);
      const frames = gifuct.decompressFrames(gif, true);

      let total = 0;
      frames.forEach(f => {
        if (f.delay) total += f.delay * 10; // GIF delay 單位為 1/100 秒 → *10 = 毫秒
      });

      return total; // 回傳毫秒
    }

    (async () => {
      const list = await loadMediaList();
      const video = document.getElementById("player");
      const gif = document.getElementById("gifPlayer");

      let index = 0;

      async function playMedia(i) {
        const url = list[i];
        const isGIF = url.toLowerCase().endsWith(".gif");

        if (isGIF) {
          video.style.display = "none";
          gif.style.display = "block";
          gif.src = url;

          let duration = await getGifDuration(url);
          console.log("GIF 播放時間:", duration, "ms");

          setTimeout(nextMedia, duration);
        } else {
          gif.style.display = "none";
          video.style.display = "block";
          video.src = url;
          video.load();
          video.play().catch(err => console.warn("autoplay 被阻擋：", err));
        }
      }

      function nextMedia() {
        index = (index + 1) % list.length;
        playMedia(index);
      }

      video.addEventListener("ended", nextMedia);

      playMedia(index);
    })();
  </script>
</body>
</html>
