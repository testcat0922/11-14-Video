<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>影片＋GIF 輪播（支援 GIF 時長設定）</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    video, img {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
      position: absolute;
      top: 0; left: 0;
    }
    #gifPlayer { display: none; }
  </style>
</head>
<body>
  <video id="player" autoplay muted playsinline></video>
  <img id="gifPlayer">

  <script>
    const baseURL = "https://github.com/testcat0922/11-14-Video/releases/latest/download/";

    // 讀取 videos.txt
    async function loadMediaList() {
      const res = await fetch("videos.txt");
      const lines = (await res.text()).split("\n").map(x => x.trim()).filter(Boolean);

      return lines.map(line => {
        const [name, time] = line.split("|");
        return {
          url: baseURL + name,
          duration: time ? parseInt(time) : null  // mp4 不需要 duration
        };
      });
    }

    (async () => {
      const list = await loadMediaList();
      const video = document.getElementById("player");
      const gif = document.getElementById("gifPlayer");
      let index = 0;

      function playMedia(i) {
        const item = list[i];
        const isGIF = item.url.toLowerCase().endsWith(".gif");

        if (isGIF) {
          video.style.display = "none";
          gif.style.display = "block";
          gif.src = item.url + "?t=" + Date.now();

          setTimeout(nextMedia, item.duration || 5000); // 預設五秒
        } else {
          gif.style.display = "none";
          video.style.display = "block";

          video.src = item.url;
          video.load();
          video.play().catch(e => console.log(e));
        }
      }

      function nextMedia() {
        index = (index + 1) % list.length;
        playMedia(index);
      }

      video.addEventListener("ended", nextMedia);

      playMedia(index);
    })();
  </script>
</body>
</html>
