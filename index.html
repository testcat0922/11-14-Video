<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>自動讀取影片與GIF清單輪播</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    video, img {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }
    #gifPlayer { display: none; }
  </style>
</head>
<body>
  <video id="player" autoplay muted playsinline></video>
  <img id="gifPlayer"/>

  <script>
    const baseURL = "https://github.com/testcat0922/11-14-Video/releases/latest/download/";

    async function loadMediaList() {
      const res = await fetch("videos.txt");
      if (!res.ok) throw new Error("無法讀 videos.txt");
      return (await res.text())
        .split("\n")
        .map(x => x.trim())
        .filter(Boolean)
        .map(name => baseURL + name);
    }

    (async () => {
      const list = await loadMediaList();
      const video = document.getElementById("player");
      const gif = document.getElementById("gifPlayer");
      let index = 0;

      function playMedia(i) {
        const url = list[i];
        const isGIF = url.toLowerCase().endsWith(".gif");

        if (isGIF) {
          video.style.display = "none";
          gif.style.display = "block";

          // ⭐ 重要：加亂數強制重新載入 GIF
          gif.src = url + "?v=" + Date.now();

          setTimeout(nextMedia, 10000); // GIF 播 10 秒
        } else {
          gif.style.display = "none";
          video.style.display = "block";

          video.src = url + "?v=" + Date.now(); // video 也加強制 reload
          video.load();
          video.play().catch(e => console.warn("autoplay blocked:", e));
        }
      }

      function nextMedia() {
        index = (index + 1) % list.length;
        playMedia(index);
      }

      video.addEventListener("ended", nextMedia);

      playMedia(index);
    })();
  </script>
</body>
</html>
